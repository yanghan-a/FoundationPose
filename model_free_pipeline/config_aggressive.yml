# cube54 激进版配置, 在 config_best.yml 上再榨一刀, 目标进入 ±2mm 区.
#
# 用法:
#   python -m model_free_pipeline.pipeline reconstruct \
#       --out real_data/cube54 \
#       --recon_cfg model_free_pipeline/config_aggressive.yml \
#       --tex_res 2048 --max_frames 200 --plot
#
# 与 config_best.yml 对比的改动:
#   trunc                 0.005 -> 0.003   SDF 截断带从 5mm 到 3mm, mesh 厚度直接砍 2mm
#   octree*_size          0.010 -> 0.005   场景表征从 1cm 到 5mm
#   n_step                6000  -> 10000   让更紧的 SDF 目标真的训到底
#
# 风险点: trunc=3mm 是 NOF 几何稳定性的边界, fs_loss 可能末段翘头.
# 如果出现 sdf_loss 末段反升 / fs_loss > 0.5 / valid_rays < 0.95,
# 说明这个 trunc 对你的数据太紧了, 退回 config_best.yml.
#
# 预期 (cube54): mean 56.86 -> 54-55 mm (进 ±2mm 区), 三轴差仍 < 1mm.
# 训练时长: 4060 Ti 上 ~18-25 分钟.

notes: 'aggressive: trunc 3mm + 10000 steps + finer octree; risk of instability'
n_step: 10000
netdepth: 8
netwidth: 256
netdepth_fine: 8
netwidth_fine: 256
N_rand: 2048
first_frame_ray_in_batch: 0
lrate: 0.01
lrate_pose: 0.01
pose_optimize_start: 0
decay_rate: 0.1
chunk: 99999999999
netchunk: 6553600
no_batching: 0
amp: true

N_samples: 128
N_samples_around_depth: 128
N_importance: 0
N_importance_iter: 1
perturb: 1
use_viewdirs: 1
i_embed: 1
i_embed_views: 2
multires: 8
multires_views: 3
feature_grid_dim: 2
raw_noise_std: 0
white_bkgd: 0
gradient_max_norm: 0.1
gradient_pose_max_norm: 0.1

i_print: 100
i_img: 1000
i_weights: 1000
i_mesh: 1000
i_nerf_normals: 1000
i_save_ray: 1000
i_pose: 1000
save_octree_clouds: True

finest_res: 512
base_res: 32
num_levels: 16
log2_hashmap_size: 22
datadir: ''
n_train_image: 300
use_octree: 1
first_frame_weight: 1
denoise_depth_use_octree_cloud: true
octree_embed_base_voxel_size: 0.005    # ↓ 5mm (was 1cm)
octree_smallest_voxel_size: 0.005
octree_raytracing_voxel_size: 0.005
octree_dilate_size: 0.005
down_scale_ratio: 1
bounding_box: [[-1,-1,-1], [1,1,1]]
farthest_pose_sampling: 0
use_mask: 1
dilate_mask_size: 0
rays_valid_depth_only: true
near: 0.1
far: 2
rgb_weight: 150
depth_weight: 0
trunc: 0.003                  # ↓ 3mm SDF 截断带 (was 5mm). 几何最大杠杆.
trunc_start: 0.003
sdf_lambda: 5
neg_trunc_ratio: 1
trunc_decay_type: ''
sdf_loss_type: l2
fs_weight: 100
empty_weight: 1
fs_rgb_weight: 0
trunc_weight: 6000
sparse_loss_weight: 0
tv_loss_weight: 0
frame_features: 2
optimize_poses: 1
pose_reg_weight: 0
point_cloud_loss_weight: 0
point_cloud_loss_normal_weight: 0
eikonal_weight: 0
normal_loss_weight: 0
feature_reg_weight: 0.1
deformation_reg_weight: 0
use_deformation_field: 0
max_pix_shift: 0.02
share_coarse_fine: 1
mode: sdf
fs_sdf: 1
crop: 0
mesh_resolution: 0.001
max_trans: 0.02
max_rot: 10

continual: True

dbscan_eps: 0.005
dbscan_eps_min_samples: 1

sync_max_delay: 0
